# Sveltia CMS config for syafiqkassim.github.io
# Admin page: https://syafiqkassim.github.io/admin/
# Sign in with "Sign In with Token" (GitHub fine-grained token, this repo only, Contents: Read and write).
# Never put the token in this file: it is public.

backend:
  name: github
  repo: syafiqkassim/syafiqkassim.github.io
  branch: main
  commit_messages:
    create: "Add article: {{slug}}"
    update: "Update article: {{slug}}"
    delete: "Delete article: {{slug}}"

site_url: https://syafiqkassim.github.io
display_url: https://syafiqkassim.github.io
media_folder: /images
public_folder: /images

# Uploaded photos are converted to WebP and shrunk to at most 1600px wide, in the browser, before saving.
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 82
        width: 1600
        height: 1600

collections:
  - name: articles
    label: Articles
    label_singular: Article
    description: >-
      Articles shown in the Writing section. Content is in English.
      Body format: blank line between paragraphs; "## " starts a heading;
      lines starting with "- " make a bullet list; cite sources as [1], [2] matching the References order.
    file: data/articles.json
    media_folder: /images/articles
    public_folder: /images/articles
    identifier_field: title
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - name: slug
        label: Slug (URL)
        widget: string
        hint: "Lowercase words joined with hyphens, unique per article, e.g. why-qr-codes-became-a-phishing-tool. Becomes the link #a-<slug>. Don't change it after publishing."
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Use lowercase letters, numbers and hyphens only']
      - name: title
        label: Title
        widget: string
      - name: date
        label: Date
        widget: datetime
        type: date
      - name: tags
        label: Tags
        widget: list
        required: false
        field: { name: tag, label: Tag, widget: string }
      - name: image
        label: Cover image
        widget: image
        required: false
        choose_url: false
        hint: "Optional. Landscape photo, ideally 1600 × 900 px (16:9). It is shown cropped to 16:9: as a thumbnail beside the title in the list (above it on phones) and full width at the top of the article. Keep the main subject in the centre. Uploads are converted to WebP automatically."
      - name: image_whole
        label: Show whole image (no crop)
        widget: boolean
        required: false
        default: false
        hint: "Turn on for square or tall images, diagrams, charts or QR codes. The whole picture is shown inside the 16:9 frame on a plain background instead of being cropped."
      - name: image_alt
        label: Image description (alt text)
        widget: string
        required: false
        hint: "Short description of the picture for screen readers, e.g. 'A QR code sticker on a parking meter'."
      - name: image_caption
        label: Image caption / credit
        widget: string
        required: false
        hint: "Optional line shown under the picture, e.g. 'Photo: Syafiq Kassim' or the source of the image."
      - name: summary
        label: Summary
        widget: text
        required: false
        hint: One or two sentences shown in the article list.
      - name: body
        label: Article
        widget: text
        hint: 'Blank line between paragraphs. "## Heading" for a heading. Lines starting with "- " for a bullet list. Cite as [1], [2]. No bold, italics or HTML.'
      - name: refs
        label: References
        widget: list
        required: false
        hint: "One source per item, in citation order ([1] = first). Only https:// links become clickable. Every fact or statistic needs a real source."
        field: { name: ref, label: Reference, widget: text }

  - name: training
    label: Training
    label_singular: Training programme
    description: Courses, workshops and seminars shown in the Training section, grouped by year (newest first).
    file: data/training.json
    identifier_field: title
    summary: "{{start}} · {{title}}"
    sortable_fields: [start, title]
    fields:
      - name: title
        label: Programme name
        widget: string
        hint: Use normal capitalisation rather than ALL CAPS. Malay or English is fine.
      - name: start
        label: Start date
        widget: datetime
        type: date
      - name: end
        label: End date
        widget: datetime
        type: date
        required: false
        hint: Leave empty for a one-day programme.

  - name: csr
    label: CSR
    label_singular: CSR involvement
    description: Community, volunteer and environmental involvement shown in the CSR section, in the order listed here.
    file: data/csr.json
    identifier_field: organisation
    summary: "{{organisation}} · {{role}}"
    fields:
      - name: organisation
        label: Organisation / programme
        widget: string
        hint: e.g. Rakan Alam Sekitar (RAS). Malay or English names are fine.
      - name: role
        label: Role
        widget: string
        hint: e.g. Life Member, Volunteer, Facilitator, Speaker.
      - name: description
        label: Short description
        widget: text
        required: false
        hint: Optional. One sentence in English about the organisation or what you did.

  - name: projects
    label: Projects
    label_singular: Project
    description: >-
      Projects shown in the Projects section, in the order listed here (drag to reorder; put the strongest first).
      Write in English. For work projects, never include IP addresses, server names, network layout, configurations or vulnerabilities.
    file: data/projects.json
    media_folder: /images/projects
    public_folder: /images/projects
    identifier_field: title
    summary: "{{type}} · {{title}}"
    fields:
      - name: title
        label: Project title
        widget: string
        hint: e.g. Web application firewall deployment
      - name: type
        label: Type
        widget: select
        options: [Work, Side project, Lab, Research]
        hint: "Work = done in your job; Side project = built for someone else outside work; Lab = personal/home lab; Research = part of your PhD."
      - name: period
        label: Period
        widget: string
        required: false
        hint: e.g. 2025 – present, or Mar 2024
      - name: role
        label: Your role
        widget: string
        required: false
        hint: e.g. Lead administrator; Team member; Solo project
      - name: challenge
        label: Challenge
        widget: text
        required: false
        hint: One or two sentences on the problem or goal.
      - name: actions
        label: What I did
        widget: text
        required: false
        hint: What you personally set up, configured, built or managed.
      - name: result
        label: Result
        widget: text
        required: false
        hint: The outcome, with numbers if you can (e.g. "Protects 40+ public web applications").
      - name: tools
        label: Tools and technologies
        widget: list
        required: false
        field: { name: tool, label: Tool, widget: string }
      - name: link
        label: Link
        widget: string
        required: false
        hint: Optional https:// link, e.g. a GitHub repository or write-up.
      - name: link_label
        label: Link text
        widget: string
        required: false
        hint: e.g. View on GitHub. Defaults to "View project".
      - name: image
        label: Image or diagram
        widget: image
        required: false
        choose_url: false
        hint: Optional. Landscape 16:9 works best. Don't upload screenshots showing internal IPs, hostnames or user data.
      - name: image_whole
        label: Show whole image (no crop)
        widget: boolean
        required: false
        default: false
      - name: image_alt
        label: Image description (alt text)
        widget: string
        required: false
